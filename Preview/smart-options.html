<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>RegOptimizer — Intelligent Options</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f4f4f5;font:14px Segoe UI,Arial}
header{height:84px;background:#151515;border-bottom:1px solid #292929;display:flex;align-items:center;padding:14px 24px;gap:14px}
.logo{width:52px;height:52px;border-radius:12px;background:#8b5cf6;display:grid;place-items:center;font-size:30px;font-weight:bold}
h1{margin:0;font-size:24px}.muted{color:#a1a1aa}nav{background:#171717;padding:12px 20px;border-bottom:1px solid #292929}
nav button{background:#202020;color:#fff;border:1px solid #333;border-radius:6px;padding:9px 13px;margin-right:6px}
nav button.active{background:#8b5cf6}.warn{padding:9px 20px;background:#2a1717;color:#fca5a5}
main{max-width:1180px;margin:auto;padding:18px 18px 90px}.toolbar{display:flex;gap:10px;margin-bottom:18px}
input{flex:1;background:#202020;border:1px solid #333;color:#fff;padding:11px;border-radius:6px}
.category{color:#c4b5fd;font-weight:600;margin:20px 0 8px}
.card{display:grid;grid-template-columns:38px 1fr 130px;gap:10px;background:#181818;border:1px solid #2a2a2a;border-radius:10px;padding:13px;margin-bottom:8px}
.toggle{width:24px;height:24px;border-radius:12px;background:#8b5cf6;margin-top:2px}.toggle.lock{background:#444}
.title{font-size:15px;font-weight:600}.badge{font-size:10px;background:#2e1065;color:#ddd6fe;padding:2px 7px;border-radius:5px;margin-left:6px}
.desc{color:#a1a1aa;margin-top:5px}.risk{background:#27272a;padding:6px 8px;border-radius:6px;height:min-content;text-align:center}
.locked{color:#fca5a5;font-weight:600;margin-top:5px}footer{position:fixed;bottom:0;left:0;right:0;background:#151515;border-top:1px solid #292929;padding:11px 18px;text-align:right}
footer button{padding:10px 14px;border:1px solid #333;background:#202020;color:#fff;border-radius:6px;margin-left:7px}footer .primary{background:#8b5cf6}
</style></head><body>
<header><div class="logo">✓</div><div><h1>RegOptimizer</h1><div class="muted">516 registros → 68 opções inteligentes</div></div></header>
<nav><button class="active">Trabalho</button><button>Trabalho + Gamer</button><button>Gamer</button><button>Experimental</button></nav>
<div class="warn">Grupos REVISAR ficam bloqueados no modo inteligente e continuam disponíveis no modo Individual / Avançado.</div>
<main><div class="toolbar"><input placeholder="Pesquisar opção, categoria ou registro"></div><div id="app"></div></main>
<footer><button>Restaurar selecionados</button><button class="primary">Aplicar selecionados</button></footer>
<script>
const data=[{"Id": "GPU_PREEMPTION_REVIEW", "Name": "GPU preemption avançado", "Category": "GPU", "Description": "Agrupa overrides de preempção do Graphics Scheduler. Mantido em revisão.", "Risk": "Alto", "Profile": "Experimental", "ReviewRequired": true, "TweakIds": ["REG0135", "REG0204", "REG0205", "REG0206", "REG0207", "REG0208", "REG0209", "REG0210", "REG0211", "REG0212", "REG0213", "REG0214", "REG0215", "REG0216", "REG0320"], "Notes": ""}, {"Id": "HAGS", "Name": "Hardware Accelerated GPU Scheduling", "Category": "GPU", "Description": "Aplica HwSchMode=2 conforme o seu arquivo.", "Risk": "Moderado", "Profile": "Gamer", "ReviewRequired": false, "TweakIds": ["REG0134"], "Notes": ""}, {"Id": "GAMEBAR_CAPTURE", "Name": "Desativar Game Bar e capturas", "Category": "Gaming", "Description": "Agrupa Game DVR, captura de áudio/microfone/cursor e políticas de Game Bar.", "Risk": "Baixo", "Profile": "Gamer", "ReviewRequired": false, "TweakIds": ["REG0065", "REG0067", "REG0068", "REG0069", "REG0070", "REG0071", "REG0072", "REG0073", "REG0076", "REG0077", "REG0078", "REG0082", "REG0083", "REG0084", "REG0085", "REG0086", "REG0087", "REG0088"], "Notes": ""}, {"Id": "MMCSS_GAMES", "Name": "MMCSS — perfil Games", "Category": "Gaming", "Description": "Agrupa prioridade GPU/CPU, scheduling category e SFIO Priority do perfil Games.", "Risk": "Moderado", "Profile": "Gamer", "ReviewRequired": false, "TweakIds": ["REG0122", "REG0123", "REG0124", "REG0125"], "Notes": ""}, {"Id": "MEMORY_MANAGEMENT_ADV", "Name": "Gerenciamento de memória avançado", "Category": "Hardware", "Description": "Agrupa paging executive, pools, SystemPages, IoPageLockLimit e outros overrides.", "Risk": "Alto", "Profile": "Experimental", "ReviewRequired": true, "TweakIds": ["REG0417", "REG0418", "REG0419", "REG0420", "REG0421", "REG0422", "REG0423", "REG0424", "REG0425", "REG0426", "REG0427", "REG0428", "REG0429", "REG0430", "REG0431", "REG0432", "REG0433", "REG0434"], "Notes": ""}, {"Id": "MOUSE_RESPONSE", "Name": "Mouse sem aceleração / resposta", "Category": "Input", "Description": "Agrupa sensibilidade, thresholds, curvas e opções de mouse do usuário/.DEFAULT.", "Risk": "Moderado", "Profile": "Gamer", "ReviewRequired": false, "TweakIds": ["REG0156", "REG0364", "REG0365", "REG0366", "REG0367", "REG0368", "REG0369", "REG0370", "REG0371", "REG0372", "REG0373", "REG0374", "REG0375", "REG0376", "REG0377", "REG0378", "REG0379", "REG0380", "REG0381", "REG0415"], "Notes": ""}, {"Id": "UI_RESPONSIVENESS", "Name": "Interface mais responsiva", "Category": "Interface", "Description": "Reduz atrasos de menus/hover e animações conforme os valores do seu arquivo.", "Risk": "Baixo", "Profile": "Trabalho", "ReviewRequired": false, "TweakIds": ["REG0023", "REG0029", "REG0030", "REG0033", "REG0058"], "Notes": ""}, {"Id": "SEARCH_WEB_PRIVACY", "Name": "Pesquisa local sem conteúdo web", "Category": "Privacidade", "Description": "Cortana, cloud search, localização e sugestões web da pesquisa.", "Risk": "Baixo", "Profile": "Trabalho", "ReviewRequired": false, "TweakIds": ["REG0004", "REG0046", "REG0303", "REG0304", "REG0305", "REG0306", "REG0307", "REG0308", "REG0309"], "Notes": ""}, {"Id": "WINDOWS_TELEMETRY_PRIVACY", "Name": "Telemetria do Windows", "Category": "Privacidade", "Description": "Agrupa DataCollection, atividades, feedback, CEIP, WMI autologgers e telemetria do arquivo.", "Risk": "Moderado", "Profile": "Trabalho", "ReviewRequired": false, "TweakIds": ["REG0164", "REG0181", "REG0182", "REG0187", "REG0226", "REG0357", "REG0358", "REG0359", "REG0360", "REG0361", "REG0382", "REG0383", "REG0389", "REG0390", "REG0391", "REG0392", "REG0393", "REG0394", "REG0395", "REG0397", "REG0398", "REG0399", "REG0400", "REG0401", "REG0402", "REG0403", "REG0405", "REG0407", "REG0408", "REG0449"], "Notes": ""}, {"Id": "SMB_TUNING_REVIEW", "Name": "SMB / compartilhamento — revisar", "Category": "Rede", "Description": "Inclui EnableOplocks=0 e outros parâmetros LanmanServer; pode prejudicar compartilhamento e trabalho em rede.", "Risk": "Alto", "Profile": "Experimental", "ReviewRequired": true, "TweakIds": ["REG0089", "REG0090", "REG0091", "REG0092", "REG0093", "REG0094", "REG0095"], "Notes": ""}, {"Id": "TCP_LOW_LATENCY", "Name": "TCP — baixa latência", "Category": "Rede", "Description": "Agrupa TCPNoDelay, TcpAckFrequency e TCPDelAckTicks nos caminhos TCP/IP do seu arquivo.", "Risk": "Moderado", "Profile": "Gamer", "ReviewRequired": false, "TweakIds": ["REG0105", "REG0106", "REG0107", "REG0114", "REG0115", "REG0116"], "Notes": ""}, {"Id": "DEFENDER_REVIEW", "Name": "Windows Defender — alto impacto", "Category": "Segurança", "Description": "Agrupa políticas que desativam ou reduzem componentes do Defender. Mantido bloqueado por segurança.", "Risk": "Alto", "Profile": "Experimental", "ReviewRequired": true, "TweakIds": ["REG0192", "REG0193", "REG0194", "REG0195", "REG0196", "REG0197", "REG0198", "REG0199", "REG0200", "REG0201", "REG0202", "REG0203"], "Notes": ""}]; const app=document.getElementById('app'); let cat='';
for(const o of data){
 if(o.Category!==cat){cat=o.Category;app.insertAdjacentHTML('beforeend',`<div class="category">${cat}</div>`);}
 app.insertAdjacentHTML('beforeend',`<div class="card"><div class="toggle ${o.ReviewRequired?'lock':''}"></div><div><div class="title">${o.Name}<span class="badge">${o.TweakIds.length} registros</span><span class="badge">${o.Profile}</span></div><div class="desc">${o.Description}</div>${o.ReviewRequired?'<div class="locked">REVISAR — aplicação em lote bloqueada</div>':''}</div><div class="risk">Risco: ${o.Risk}</div></div>`);
}
</script></body></html>
